---
- name: Créer le dossier de build de l'image Jenkins
  ansible.builtin.file:
    path: "{{ jenkins_build_dir }}"
    state: directory
    mode: "0755"

- name: Copier le Dockerfile et la liste des plugins
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ jenkins_build_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - Dockerfile
    - plugins.txt

- name: Lire le GID du groupe docker
  ansible.builtin.getent:
    database: group
    key: docker

- name: Construire l'image Jenkins
  community.docker.docker_image:
    name: "{{ jenkins_image }}"
    source: build
    build:
      path: "{{ jenkins_build_dir }}"
    state: present

- name: Créer le volume de données Jenkins
  community.docker.docker_volume:
    name: jenkins_home

- name: Démarrer Jenkins
  community.docker.docker_container:
    name: "{{ jenkins_container }}"
    image: "{{ jenkins_image }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ jenkins_http_port }}:8080"
      - "{{ jenkins_agent_port }}:50000"
    groups:
      - "{{ ansible_facts.getent_group.docker[1] }}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - name: "{{ jenkins_network }}"
    networks_cli_compatible: true

- name: Attendre que Jenkins réponde
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_http_port }}/login"
    status_code: 200
  register: jenkins_up
  until: jenkins_up.status == 200
  retries: 30
  delay: 10
